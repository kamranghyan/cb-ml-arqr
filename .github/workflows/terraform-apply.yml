name: Terraform Apply

on:
  push:
    branches:
      - main

env:
  TF_VERSION:  "1.10.0"
  WORKING_DIR: "infra/terraform/environments/dev"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infra:    ${{ steps.filter.outputs.infra }}
      lambdas:  ${{ steps.filter.outputs.lambdas }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ← fix: fetch full history for diff

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/terraform/**'
              - '.github/workflows/**'
            lambdas:
              - 'src/lambdas/**'
            frontend:
              - 'src/frontend/**'

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'

    concurrency:
      group: terraform-apply
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_aws_access_key:  ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_api_key:         ${{ secrets.TF_VAR_API_KEY }}
          TF_VAR_prefix:          "cb-ml"
          TF_VAR_environment:     "dev"
          TF_VAR_owner:           "cb-ml-team"
          TF_VAR_allowed_origins: "*"

  deploy-lambdas:
    name: Deploy Lambdas
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.lambdas == 'true'

    strategy:
      matrix:
        lambda:
          - menu-service
          - order-service
          - tenant-service
          - auth-service
          - websocket-connect
          - websocket-disconnect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Zip Lambda — ${{ matrix.lambda }}
        run: |
          cd src/lambdas/${{ matrix.lambda }}
          zip -r ${{ matrix.lambda }}.zip .
          echo "✅ Zipped ${{ matrix.lambda }}"

      - name: Deploy Lambda — ${{ matrix.lambda }}
        run: |
          aws lambda update-function-code \
            --function-name cb-ml-dev-${{ matrix.lambda }} \
            --zip-file fileb://src/lambdas/${{ matrix.lambda }}/${{ matrix.lambda }}.zip \
            --region ap-south-1
          echo "✅ Deployed cb-ml-dev-${{ matrix.lambda }}"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Upload index.html to S3
        run: |
          aws s3 cp src/frontend/index.html \
            s3://cb-ml-dev-menu-assets/index.html \
            --content-type "text/html" \
            --region ap-south-1
          echo "✅ Uploaded index.html"

      - name: Invalidate CloudFront Cache
        run: |
          # ← fix: check secret is set before running
          if [ -z "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            echo "❌ CLOUDFRONT_DISTRIBUTION_ID secret is not set"
            echo "Go to: GitHub → Settings → Secrets → Actions → New secret"
            echo "Name: CLOUDFRONT_DISTRIBUTION_ID"
            echo "Value: run 'terraform output cloudfront_distribution_id'"
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"
          echo "✅ CloudFront cache invalidated"
