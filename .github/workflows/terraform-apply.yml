# =============================================================================
# CD — TERRAFORM APPLY
# Runs automatically on merge to main branch
# =============================================================================

name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/terraform/**'

env:
  TF_VERSION: "1.6.0"
  WORKING_DIR: "infra/terraform/environments/dev"

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    # Prevent multiple applies running simultaneously
    concurrency:
      group: terraform-apply
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_aws_access_key:  ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_api_key:         ${{ secrets.TF_VAR_API_KEY }}
          TF_VAR_prefix:          "cb-ml"
          TF_VAR_environment:     "dev"
          TF_VAR_owner:           "cb-ml-team"
          TF_VAR_allowed_origins: "*"
