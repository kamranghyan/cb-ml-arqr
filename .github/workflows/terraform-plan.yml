# =============================================================================
# CI — TERRAFORM PLAN
# Runs on every Pull Request targeting main branch
# Posts terraform plan output as PR comment
# =============================================================================
name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/terraform/**'

env:
  TF_VERSION: "1.10.0"
  WORKING_DIR: "infra/terraform/environments/dev"

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      # Plan with full output visible in Actions logs
      - name: Terraform Plan
        run: terraform plan -no-color
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_aws_access_key:  ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_api_key:         ${{ secrets.TF_VAR_API_KEY }}
          TF_VAR_prefix:          "cb-ml"
          TF_VAR_environment:     "dev"
          TF_VAR_owner:           "cb-ml-team"
          TF_VAR_allowed_origins: "*"