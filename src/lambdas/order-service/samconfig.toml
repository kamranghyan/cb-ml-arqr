version = 0.1

[default.global.parameters]
stack_name = "orders-fastapi-dev"
region = "ap-south-1"

[default.build.parameters]
cached   = true
parallel = true

[default.deploy.parameters]
confirm_changeset = true
resolve_s3        = true
capabilities      = "CAPABILITY_IAM"
parameter_overrides = "Environment=\"dev\" MenuTable=\"MenuTable-dev\" OrderTable=\"cb-ml-dev-order\" CognitoRegion=\"ap-south-1\" CognitoUserPoolId=\"ap-south-1_SCyQ50etN\" StepArn=\"*\" RedisHost=\"localhost\" RedisPort=\"6379\" LogLevel=\"INFO\" SkipMenuValidation=\"false\""
s3_prefix = "orders-fastapi-dev"
disable_rollback = true
image_repositories = []
