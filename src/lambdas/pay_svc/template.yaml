AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: SAM Template for Payment Service (payment_svc)

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - arm64

    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PAYMENTS_TABLE_NAME: !Ref PaymentTable
        EVENT_BUS_NAME: !Ref EventBusName

        EASYPAISA_STORE_ID: !Ref EasyPaisaStoreId
        EASYPAISA_CREDENTIALS: !Ref EasyPaisaCredentials
        EASYPAISA_ACCOUNT_NUM: !Ref EasyPaisaAccountNum
        EASYPAISA_BASE_URL: !Ref EasyPaisaBaseUrl
        EASYPAISA_POST_BACK_URL: !Ref EasyPaisaPostBackUrl
        EASYPAISA_ENV: !Ref EasyPaisaEnv

        USE_MOCK_PAYMENTS: "true"

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  EventBusName:
    Type: String
    Default: arqr-event-bus-dev

  EasyPaisaEnv:
    Type: String
    Default: sandbox

  EasyPaisaStoreId:
    Type: String
    Default: "12345"

  EasyPaisaCredentials:
    Type: String
    Default: "dummy_key"

  EasyPaisaAccountNum:
    Type: String
    Default: "03001234567"

  EasyPaisaBaseUrl:
    Type: String
    Default: "https://easypaystg.easypaisa.com.pk/easypay-service/rest/v4"

  EasyPaisaPostBackUrl:
    Type: String
    Default: "https://example.com/callback"


Resources:

  # ============================================================
  # Shared Lambda Layer
  # ============================================================

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "menulay-shared-${Environment}"
      ContentUri: ../layers/shared_layer
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete


  # ============================================================
  # Payment DynamoDB Table
  # ============================================================

  PaymentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "PaymentTable-${Environment}"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S

      KeySchema:
        - AttributeName: orderId
          KeyType: HASH


  # ============================================================
  # Payment Lambda
  # ============================================================

  PaymentServiceFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: !Sub "payment-svc-${Environment}"

      CodeUri: .

      Handler: app.main.handler

      Layers:
        - !Ref SharedLayer

      Policies:

        # Payment DynamoDB access
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentTable

        # Payment SVC publishes payment.succeeded
        # to the shared EventBridge bus.
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBusName

      Events:
        PaymentApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY


Outputs:

  PaymentApiUrl:
    Description: Payment Service API URL

    Value: !Sub
      - "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
      - {}

  PaymentTableName:
    Description: Payment DynamoDB table name
    Value: !Ref PaymentTable

  EventBusName:
    Description: Shared EventBridge bus used by Payment SVC
    Value: !Ref EventBusName