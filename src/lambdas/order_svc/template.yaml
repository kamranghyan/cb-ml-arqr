AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MenuLay — order_svc Lambda (FastAPI + Mangum, shared Lambda Layer)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  MenuTable:
    Type: String
    Default: MenuTable-dev
  OrderTable:
    Type: String
    Default: cb-ml-dev-order
  CognitoRegion:
    Type: String
    Default: ap-south-1
  CognitoUserPoolId:
    Type: String
    Default: ap-south-1_SCyQ50etN
  CognitoClientId:
    Type: String
    Default: 7903hkujl9qeq67toemi5qrhes
    NoEcho: true
  StepArn:
    Type: String
    Default: "none"
  RedisHost:
    Type: String
    Default: localhost
  RedisPort:
    Type: String
    Default: "6379"
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
  SkipMenuValidation:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Globals:
  Function:
    Runtime:       python3.13
    Architectures: [arm64]
    MemorySize:    512
    Timeout:       30
    Environment:
      Variables:
        ENVIRONMENT:          !Ref Environment
        LOG_LEVEL:            !Ref LogLevel
        TABLE_MENU:           !Ref MenuTable
        TABLE_ORDER:          !Ref OrderTable
        STEP_ARN:             !Ref StepArn
        SKIP_MENU:            !Ref SkipMenuValidation
        REDIS_HOST:           !Ref RedisHost
        REDIS_PORT:           !Ref RedisPort
        COGNITO_REGION:       !Ref CognitoRegion
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID:    !Ref CognitoClientId
  Api:
    Cors:
      AllowMethods: "'GET,POST,PATCH,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Tenant-Id'"
      AllowOrigin:  "'*'"

Resources:

  # ── Shared Lambda Layer ─────────────────────────────────────────────────────
  # Common code (auth, exceptions, logging, aws clients) shared by all
  # MenuLay services. Source: ../../layers/shared_layer
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "menulay-shared-${Environment}"
      Description: MenuLay shared layer (cognito auth, exceptions, structured logging)
      ContentUri: ../layers/shared_layer
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete

  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:      !Sub "order-svc-api-${Environment}"
      StageName: !Ref Environment

  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "order-svc-${Environment}"
      Description:  Order CRUD + Step Functions orchestration (FastAPI + Mangum)
      CodeUri:      ./
      Handler:      handler.lambda_handler
      Layers:
        - !Ref SharedLayer

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchGetItem
              Resource:
                - !Sub "arn:aws:dynamodb:ap-south-1:${AWS::AccountId}:table/${OrderTable}"
                - !Sub "arn:aws:dynamodb:ap-south-1:${AWS::AccountId}:table/${OrderTable}/index/*"
                - !Sub "arn:aws:dynamodb:ap-south-1:${AWS::AccountId}:table/${MenuTable}"
                - !Sub "arn:aws:dynamodb:ap-south-1:${AWS::AccountId}:table/${MenuTable}/index/*"
            # Step Functions — start executions for the order lifecycle state machine
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource:
                - !Ref StepArn

      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path:      /health
            Method:    GET
        OrdersRoot:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path:      /orders
            Method:    ANY
        OrdersProxy:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path:      /orders/{proxy+}
            Method:    ANY

  OrdersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:    !Sub "/aws/lambda/order-svc-${Environment}"
      RetentionInDays: 30

Outputs:
  ApiEndpoint:
    Description: Orders API endpoint
    Value: !Sub "https://${OrdersApi}.execute-api.ap-south-1.amazonaws.com/${Environment}"
  FunctionArn:
    Value: !GetAtt OrdersFunction.Arn
  SharedLayerArn:
    Description: Shared layer ARN (reuse in other MenuLay services)
    Value: !Ref SharedLayer
