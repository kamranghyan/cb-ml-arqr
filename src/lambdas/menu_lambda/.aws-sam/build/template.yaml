AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "MenuLay \u2014 menu_svc Lambda (FastAPI + Mangum, shared Lambda Layer)"
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - staging
    - prod
  MenuTable:
    Type: String
    Default: MenuTable-dev
  TenantTable:
    Type: String
    Default: TenantTable-dev
  AssetBucketName:
    Type: String
    Default: menu-assets-dev-833090513377
  CognitoRegion:
    Type: String
    Default: ap-south-1
  CognitoUserPoolId:
    Type: String
    Default: ap-south-1_SCyQ50etN
  CognitoClientId:
    Type: String
    Default: 7903hkujl9qeq67toemi5qrhes
    NoEcho: true
  RedisHost:
    Type: String
    Default: localhost
  RedisPort:
    Type: String
    Default: '6379'
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
    - DEBUG
    - INFO
    - WARNING
    - ERROR
Globals:
  Function:
    Runtime: python3.13
    Architectures:
    - arm64
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        LOG_LEVEL:
          Ref: LogLevel
        MENU_TABLE:
          Ref: MenuTable
        TENANT_TABLE:
          Ref: TenantTable
        TABLE_RESTAURANT_TABLES:
          Fn::Sub: RestaurantTables-${Environment}
        S3_BUCKET:
          Ref: AssetBucketName
        ASSET_BUCKET_NAME:
          Ref: AssetBucketName
        REDIS_HOST:
          Ref: RedisHost
        REDIS_PORT:
          Ref: RedisPort
        MAX_IMAGE_MB: '5'
        MAX_AR_MB: '50'
        COGNITO_REGION:
          Ref: CognitoRegion
        COGNITO_USER_POOL_ID:
          Ref: CognitoUserPoolId
        COGNITO_CLIENT_ID:
          Ref: CognitoClientId
  Api:
    Cors:
      AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
      AllowHeaders: '''Content-Type,Authorization,X-Tenant-Id'''
      AllowOrigin: '''*'''
Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: menulay-shared-${Environment}
      Description: MenuLay shared layer (cognito auth, exceptions, structured logging)
      ContentUri: ..\..\..\layers\shared_layer
      CompatibleRuntimes:
      - python3.13
      CompatibleArchitectures:
      - arm64
      RetentionPolicy: Delete
  MenuApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: menu-svc-api-${Environment}
      StageName:
        Ref: Environment
      BinaryMediaTypes:
      - multipart/form-data
      - image/jpeg
      - image/png
      - image/webp
      - model/gltf-binary
  MenuFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: menu-svc-${Environment}
      Description: "Menu CRUD \u2014 restaurants, categories, items, tables (FastAPI\
        \ + Mangum)"
      CodeUri: MenuFunction
      Handler: handler.lambda_handler
      Layers:
      - Ref: SharedLayer
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:BatchGetItem
          Resource:
          - Fn::Sub: arn:aws:dynamodb:ap-south-1:${AWS::AccountId}:table/${MenuTable}
          - Fn::Sub: arn:aws:dynamodb:ap-south-1:${AWS::AccountId}:table/${MenuTable}/index/*
          - Fn::Sub: arn:aws:dynamodb:ap-south-1:${AWS::AccountId}:table/${TenantTable}
          - Fn::Sub: arn:aws:dynamodb:ap-south-1:${AWS::AccountId}:table/RestaurantTables-${Environment}
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:PutObject
          - s3:DeleteObject
          Resource:
            Fn::Sub: arn:aws:s3:::${AssetBucketName}/*
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId:
              Ref: MenuApi
            Path: /health
            Method: GET
        MenusRoot:
          Type: Api
          Properties:
            RestApiId:
              Ref: MenuApi
            Path: /menus
            Method: ANY
        MenusProxy:
          Type: Api
          Properties:
            RestApiId:
              Ref: MenuApi
            Path: /menus/{proxy+}
            Method: ANY
    Metadata:
      SamResourceId: MenuFunction
  MenuLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/menu-svc-${Environment}
      RetentionInDays: 30
Outputs:
  ApiEndpoint:
    Description: Menu API endpoint
    Value:
      Fn::Sub: https://${MenuApi}.execute-api.ap-south-1.amazonaws.com/${Environment}
  FunctionArn:
    Value:
      Fn::GetAtt:
      - MenuFunction
      - Arn
  SharedLayerArn:
    Description: Shared layer ARN (reuse in other MenuLay services)
    Value:
      Ref: SharedLayer
