<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; padding: 24px; }
    h1   { color: #2c3e50; }
    .card { background: #fff; border-radius: 8px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .btn  { background: #2c3e50; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 8px; }
    .btn:hover { background: #1a252f; }
    pre   { background: #f8f9fa; padding: 12px; border-radius: 6px; font-size: 12px; overflow: auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  </style>
</head>
<body>
  <h1>⚙️ Admin Dashboard</h1>
  <p>Logged in as: <strong>admin@restaurant.com</strong></p>

  <div class="grid">
    <div class="card">
      <h3>Menu Management</h3>
      <button class="btn" onclick="loadMenu()">Load Menu</button>
      <pre id="menu-output">Click to load...</pre>
    </div>

    <div class="card">
      <h3>Tenant Management</h3>
      <button class="btn" onclick="loadTenants()">Load Tenants</button>
      <pre id="tenants-output">Click to load...</pre>
    </div>

    <div class="card">
      <h3>Orders Overview</h3>
      <button class="btn" onclick="loadOrders()">Load Orders</button>
      <pre id="orders-output">Click to load...</pre>
    </div>

    <div class="card">
      <h3>Auth Test</h3>
      <button class="btn" onclick="testAuth()">Test Login</button>
      <pre id="auth-output">Click to test...</pre>
    </div>
  </div>

  <script>
        const API_BASE = "https://if77udoyze.execute-api.ap-south-1.amazonaws.com/dev";

    async function call(endpoint, method = "GET", body = null) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body) opts.body = JSON.stringify(body);
      const res  = await fetch(`${API_BASE}${endpoint}`, opts);
      return res.json();
    }

    async function loadMenu()    { document.getElementById("menu-output").textContent    = JSON.stringify(await call("/menu"), null, 2); }
    async function loadTenants() { document.getElementById("tenants-output").textContent = JSON.stringify(await call("/tenants"), null, 2); }
    async function loadOrders()  { document.getElementById("orders-output").textContent  = JSON.stringify(await call("/orders"), null, 2); }
    async function testAuth()    { document.getElementById("auth-output").textContent    = JSON.stringify(await call("/auth/login", "POST", { email: "admin@test.com", password: "Test@1234" }), null, 2); }
  </script>
</body>
</html>
