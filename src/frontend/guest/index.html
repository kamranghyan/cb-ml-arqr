<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guest Menu</title>
  <style>
    body { font-family: sans-serif; background: #fff8f0; padding: 24px; }
    h1   { color: #e67e22; }
    .card { background: #fff; border-radius: 8px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .btn  { background: #e67e22; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn:hover { background: #d35400; }
    pre   { background: #f5f5f5; padding: 12px; border-radius: 6px; font-size: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>🍽️ Guest Menu</h1>
  <p>Welcome! Browse our menu below.</p>

  <div class="card">
    <h3>Menu Items</h3>
    <button class="btn" onclick="loadMenu()">Load Menu</button>
    <pre id="menu-output">Click to load menu...</pre>
  </div>

  <div class="card">
    <h3>Place Order</h3>
    <button class="btn" onclick="placeOrder()">Place Test Order</button>
    <pre id="order-output">Click to place order...</pre>
  </div>

  <script>
        const API_BASE = "https://if77udoyze.execute-api.ap-south-1.amazonaws.com/dev";

    async function loadMenu() {
      const el = document.getElementById("menu-output");
      el.textContent = "Loading...";
      try {
        const res  = await fetch(`${API_BASE}/menu`);
        const data = await res.json();
        el.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        el.textContent = "Error: " + e.message;
      }
    }

    async function placeOrder() {
      const el = document.getElementById("order-output");
      el.textContent = "Placing order...";
      try {
        const res  = await fetch(`${API_BASE}/orders`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: ["Burger", "Fries"] })
        });
        const data = await res.json();
        el.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        el.textContent = "Error: " + e.message;
      }
    }
  </script>
</body>
</html>
