<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Display</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 24px; }
    h1   { color: #e94560; }
    .card { background: #16213e; border-radius: 8px; padding: 16px; margin: 12px 0; border-left: 4px solid #e94560; }
    .btn  { background: #e94560; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn:hover { background: #c0392b; }
    pre   { background: #0f3460; padding: 12px; border-radius: 6px; font-size: 12px; overflow: auto; color: #eee; }
    .status { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #e94560; }
  </style>
</head>
<body>
  <h1>👨‍🍳 Kitchen Display System</h1>
  <p>Logged in as: <strong>kitchen-staff@restaurant.com</strong></p>

  <div class="card">
    <h3>Incoming Orders <span class="status">LIVE</span></h3>
    <button class="btn" onclick="loadOrders()">Refresh Orders</button>
    <pre id="orders-output">Click to load orders...</pre>
  </div>

  <script>
        const API_BASE = "https://if77udoyze.execute-api.ap-south-1.amazonaws.com/dev";

    async function loadOrders() {
      const el = document.getElementById("orders-output");
      el.textContent = "Loading...";
      try {
        const res  = await fetch(`${API_BASE}/orders`);
        const data = await res.json();
        el.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        el.textContent = "Error: " + e.message;
      }
    }

    // Auto-refresh every 10 seconds
    loadOrders();
    setInterval(loadOrders, 10000);
  </script>
</body>
</html>
